[server]
http_addr = 0.0.0.0
http_port = 3002

[security]
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}

[paths]
data = ${GF_PATHS_DATA}
logs = ${GF_PATHS_LOGS}
plugins = ${GF_PATHS_PLUGINS}
provisioning = ${GF_PATHS_PROVISIONING}

[plugins]
allow_loading_unsigned_plugins = yesoreyeram-infinity-datasource

[auth.anonymous]
enabled = true
org_role = Viewer[server]
